<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Router</title>
    <link rel="stylesheet" href="css/element.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        [v-cloak] {
            display: none !important;
        }

        .box-card {
            width: 500px;
            margin: 0 auto;
            margin-top: 60px;
        }

        .el-form-item_content_button {
            text-align: end;
        }

        .el-input__icon {
            cursor: pointer;
        }
        .clearfix {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <a id="top" style="display:none;">TOP</a>
    <div id="container" v-cloak>
        <el-card class="box-card" v-if="showChangePwd" shadow="always">
            <div slot="header" class="clearfix">
                <span>{{TAB.sys.changePasswd}}</span>
            </div>
            <el-alert :title="PROMPT.tips.powerPassword" type="warning" :closable="false" show-icon></el-alert>
            <el-form label-position="top" :model="ruleForm" :rules="rules" ref="ruleForm"
                :validate-on-rule-change="false">
                <el-form-item :label="DOC.sys.oldPasswd" prop="oldPasswd">
                    <el-input v-model="ruleForm.oldPasswd" autocomplete="off" type="password" >
                    </el-input>
                </el-form-item>
                <el-form-item :label="DOC.sys.newPasswd" prop="pass">
                    <el-input v-model="ruleForm.pass" autocomplete="off" type="password">
                    </el-input>
                </el-form-item>
                <el-form-item :label="DOC.sys.duplicateNewPasswd" prop="checkPass">
                    <el-input v-model="ruleForm.checkPass" autocomplete="off" type="password">
                    </el-input>
                </el-form-item>
                <el-form-item class="el-form-item_content_button">
                    <el-button type="primary" @click="submitForm(ruleForm.oldPasswd, ruleForm.checkPass)">
                        {{DOC.btn.savePinOk}}</el-button>
                </el-form-item>
            </el-form>
        </el-card>
    </div>
