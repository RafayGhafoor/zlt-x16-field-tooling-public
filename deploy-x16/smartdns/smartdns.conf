########################################
# SmartDNS-rs configuration — ZLT X16
#
# Ported from QManager's deploy/smartdns.conf (written for the GreenPacket O5A,
# where it has run since 2026-07). The DIRECTIVES are unchanged on purpose: that
# file is the configuration that measured well there, and inventing a new one for
# this device would throw away every measurement behind it. Two things are
# device-specific and are called out where they occur:
#
#   * this resolver is NOT the LAN-facing resolver. dnsmasq owns 192.168.3.1:53
#     and forwards here (`strict-order`, wired by zlt-smartdns.sh). Nothing in
#     this file names the LAN address.
#   * the *latency map* is not portable. Which upstream hands out a near-class
#     Google edge depends on where the box sits on the network, so the provider
#     pool below must be re-measured on this unit before the edge selection is
#     trusted. `qmanager-dns-edge.timer` does exactly that, 5 minutes after boot
#     and every 30 after.
#
# Owner: /data/qmanager/bin/qmanager_dns_apply is the ONLY writer of the live file
# at /data/qmanager/etc/smartdns.conf (root:root 0600). Hand-edits to that file are
# allowed (the page's editor saves through the helper) but must not be assumed
# permanent inside the `# BEGIN QMANAGER-EDGE` block, which is regenerated.
# This file is the seed a fresh install copies there.
########################################

# Loopback only — port 53 stays dnsmasq's on the LAN bridge. This resolver is
# dnsmasq's upstream, not a LAN-facing server.
bind 127.0.0.1:5353

########################################
# Cache
########################################

# 8192. On the O5A, 4096 was SATURATED — every restart reported exactly the cap
# ("DNS cache 4096 records loaded"), i.e. the table was full and evicting names
# that were still in use. If a restart here again reports a count equal to this
# cap, that is the signal to raise it (RSS against MemAvailable is not).
# This box has ~150 MB free on /data and 322 MB of tmpfs.
cache-size 8192
cache-persist yes
# tmpfs, not flash — lost on reboot, rebuilt cheaply. Never move this to /data:
# the cache is rewritten continuously and would be a flash-wear device.
cache-file /tmp/smartdns.cache

########################################
# Upstream connection reuse
########################################

# 600 s (default 120). With the default, the first lookup after any quiet spell paid
# a fresh TCP+TLS handshake to every pool member (measured on the O5A: 704 ms vs
# 43 ms for www.docker.com). 600 also matches rr-ttl-min below, so a cached entry
# and the connection that produced it age out together. Do not raise much further:
# this WAN is behind carrier NAT, and a connection kept past the operator's NAT idle
# timeout is silently black-holed, which costs a full client-side timeout instead of
# a cheap handshake.
tcp-idle-time 600

########################################
# IPv6 / AAAA
########################################

# The X16 has NO IPv6 data path: /proc/net/if_inet6 holds only lo, an eth0
# link-local and bridge0's link-local + fd53:... ULA; there is no global address
# and no default IPv6 route. Without this line smartdns still races every AAAA
# query upstream and returns global IPv6 addresses no LAN client can reach, so an
# IPv6-preferring client (Windows/macOS/Android, happy-eyeballs) stalls on a failed
# connect before falling back to A.
#
# RE-EXAMINE THIS LINE IF IPv6 EVER COMES BACK: it is global and would deny every
# client AAAA. The check is behavioural — an uncached AAAA that returns a real
# address means IPv6 is back.
force-AAAA-SOA yes

# TTL floor. Many everyday names publish very short TTLs (measured on the O5A:
# wikipedia.org 2 s, whatsapp.com 26 s), so without this smartdns re-queries them
# constantly over a cellular link. serve-expired below already makes a post-expiry
# lookup instant, so this is traffic reduction, not a latency fix. Keep it modest: a
# high floor pins clients to a possibly-stale CDN edge IP, which on mobile is worse
# than a background re-query.
rr-ttl-min 600

########################################
# Refresh cached entries before expiry
########################################

# prefetch-domain deliberately OFF: it re-runs the full upstream race in the
# background for near-expiry entries, which is redundant with serve-expired below
# (that serves the stale answer instantly and refreshes only for names still being
# queried) — extra upstream traffic for no measured benefit.
# prefetch-domain yes

# Serve a stale answer instantly while refreshing in the background, instead of
# blocking the client on a cold lookup.
#
# serve-expired-ttl is 1 h, not 24 h. The long window only ever hid upstream
# outages; dnsmasq's carrier tier (strict-order) covers anything longer, and a
# day-old CDN IP surviving an outage is the failure mode that took
# www.speedtest.net down on the O5A (one dead Cloudflare edge address, pinned).
serve-expired yes
serve-expired-ttl 3600
serve-expired-reply-ttl 30

########################################
# Logging — tmpfs + bounded (flash wear on a resource-tight device)
########################################

log-level warn
log-file /tmp/smartdns.log
log-size 128k
log-num 2

########################################
# CDN edge selection — PER-DOMAIN, never global
########################################

# Read the whole block before changing it. The GLOBAL form
#
#     speed-check-mode ping + response-mode fastest-ip
#
# was removed on the O5A on 2026-10-01 because it collapses every answer to exactly
# ONE address (12/12 single-IP answers) and rr-ttl-min + dnsmasq's cache then pin
# that one address for ~10 minutes: a single unhealthy edge IP becomes a 10-minute
# outage with no fallback. Measured case: www.speedtest.net's
# 104.17.148.22 RSTs every TLS ClientHello while its sibling 104.17.147.22
# handshakes fine — and both pass ICMP and tcp:443, so no probe can rank it away.
#
# What replaces it: probe only the Google-family names that measurably benefit and
# leave every other name with its full record set so clients can fall back.
# Measured on the O5A, interleaved: dl.google.com 350 ms -> 46-74 ms, and
# www.speedtest.net keeps both A records.
#
# Rejected alternatives (measured, do not retry):
#   max-reply-ip-num 10 + response-mode first-ping   still 1 record per answer
#   global speed-check + per-domain -no-speed-check  still 1 record
#   domain-rules /gstatic.com/ -speed-check-mode ping
#                                                    no reliable win (1 of 3 rounds)
#   edns-client-subnet <public-ip>/24                no effect, leaks the subnet
#   nameserver /domain/ip                            silently ignored by 0.13.1
#   address /domain/ip                               works (used below)
#
# These two lines are NOT redundant with the generated `# BEGIN QMANAGER-EDGE`
# block that qmanager_dns_apply appends: the block decides WHICH upstreams answer
# for google.com/googlevideo.com, this decides how the returned addresses are
# ranked within that answer.
domain-rules /google.com/ -speed-check-mode ping
domain-rules /googlevideo.com/ -speed-check-mode ping

########################################
# Bootstrap DNS
########################################

# Only used to resolve the DoH hostnames themselves; excluded from the race.
server https://8.8.8.8/dns-query -bootstrap-dns -exclude-default-group
server https://9.9.9.9/dns-query -bootstrap-dns -exclude-default-group

########################################
# Upstream pool
########################################
#
# A WIDE pool is deliberate, and it is not a latency cost. This config sets no
# global speed-check-mode, so 0.13.1 FORCES response_strategy = FastestResponse:
# the first upstream to return NOERROR wins and failures are simply demoted. Extra
# members are queue depth — another chance of a fast answer — off the critical
# path. Measured on the O5A, cold medians: 4 members 67/71 ms, 7 members 56/57 ms,
# 10 members 54/45 ms.
#
# Do NOT trim on /tmp/smartdns.log error counts: those are dominated by transient
# cellular blips hitting several upstreams in the same second, which libels healthy
# servers.
#
# PRIVACY TRADE-OFF: every cache miss is sent to every member, so a wide pool
# discloses each cold query to more operators. That is the deliberate price of the
# latency and failover gains. The filtering providers (Quad9, AdGuard) do not
# enforce blocks inside a mixed race — a non-NOERROR answer is skipped and an
# unblocking member can win. Blocking is done by the `address /.../#` rules below.
#
# FAILOVER is inherent, not configured: 0.13.1 has no priority/health mechanism and
# does not need one — with one member pointed at a blackhole the pool still
# answered correctly through the others.

# Google — DoH by hostname, the only Google form that measured well (h3 lost to
# QUIC shaping and crypto on a single-core CPU; DoT needs its own handshake).
server https://dns.google/dns-query

# Cloudflare, both endpoint forms: the IP literal needs no bootstrap step, so it
# can answer sooner on a cold pool.
server https://cloudflare-dns.com/dns-query
server https://1.1.1.1/dns-query

# Quad9 (security filtering) and AdGuard unfiltered.
server https://dns.quad9.net/dns-query
server https://unfiltered.adguard-dns.com/dns-query

# The remaining three quarters of the pool.
server https://dns.nextdns.io
server https://sky.rethinkdns.com/
server https://doh.opendns.com/dns-query

# DO NOT RE-ADD Mullvad. On the O5A it emitted 27 identical timeouts in 7 minutes
# while the other eight produced none, and it fails IN THE POOL only — a
# reachability probe cannot rule it out (`smartdns resolve @dns.mullvad.net`
# succeeded 5/5 while a scratch instance with it as sole upstream answered 0/5).
# A dead member contributes nothing to a race except failed connection attempts.

########################################
# Per-domain overrides found via profiling
########################################

# Alibaba's anti-bot/tracking edge under aidcgroup.net is called with a brand-new
# random subdomain on every page load, so caching can never help it. Verified across
# 6+ independently random subdomains that it is a true wildcard.
address /aidcgroup.net/47.246.72.115

# Non-essential chat-widget/RUM init and telemetry beacon calls on daraz.pk tag
# pages — blocked outright. Behaviour trade-off (may disable Daraz's live-chat
# widget), not a pure perf fix; delete these two lines if chat breaks.
address /umlazada.alibaba.com/#
address /epss.alibaba-inc.com/#

########################################
# Blocked outright
########################################

# Guardsquare (mobile app shielding / RASP vendor). Suffix rules, so these cover
# the apex plus every subdomain at any depth. smartdns matches by domain-label
# suffix, not substring — `address /guardsquare/#` and `address /*guardsquare*/#`
# were both tested and matched nothing, so a new guardsquare TLD needs its own line.
# A blocked name answers SOA-only; dnsmasq forwards that answer rather than falling
# through to the carrier (verified on this unit 2026-10-26).
address /guardsquare.com/#
address /guardsquare.io/#
address /guardsquare.net/#
